<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Alcyo Shorts. A pointed A whose counter is Alcyone's four-point star,
       cut out of the letter, on a blue tile. The tile follows the macOS icon
       grid: 824 px on a 1024 canvas. Same drawing as ui/AppMark.tsx. -->
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="200" y1="100" x2="820" y2="924">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B1E66" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <path filter="url(#lift)" fill="#FFFFFF" fill-rule="evenodd" d="M512 196 254 772h140l40-96h156l40 96h140ZM512 396c8 56 34 82 90 90-56 8-82 34-90 90-8-56-34-82-90-90 56-8 82-34 90-90Z"/>
</svg>
