packages:
  - apps/*
  - packages/*
  - scripts

# Dependencies allowed to run install scripts. electron downloads its binary;
# electron-winstaller (Squirrel) isn't used because Windows ships as nsis.
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false
  # JASSUB's local-font lookup; Alcyo uses only bundled fonts.
  lfa-ponyfill: false

minimumReleaseAgeExclude:
  - globals@17.14.0
  - jassub@2.5.24
