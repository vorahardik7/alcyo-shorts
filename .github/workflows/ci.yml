# Checks, end-to-end tests and packaging on macOS (arm64) and Windows (x64).
# Plan section 19. A v* tag also publishes both installers to a GitHub Release,
# once every check on both systems has passed.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac-arm64
            package: package:mac
            executable: apps/desktop/release/mac-arm64/Alcyo Shorts.app/Contents/MacOS/Alcyo Shorts
            artifact: apps/desktop/release/*.dmg
          - os: windows-latest
            target: win-x64
            package: package:win
            executable: apps/desktop/release/win-unpacked/Alcyo Shorts.exe
            artifact: apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Ad-hoc signing on macOS; don't pick up any certificate on the runner.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Before the long build: v0.1.0 must match apps/desktop/package.json.
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $app (apps/desktop/package.json)."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: No media in git outside examples/demo/
        run: pnpm check:media

      - name: Cache downloaded tools
        uses: actions/cache@v4
        with:
          path: .cache/binaries
          key: binaries-${{ matrix.target }}-${{ hashFiles('scripts/binaries.lock.json') }}

      - name: Fetch pinned tools
        run: pnpm fetch-binaries --target ${{ matrix.target }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # --continue: report every failing package, not just the first.
        # Real-tool tests (ffmpeg renders, spawned node) are slower on shared runners.
        run: pnpm exec turbo run test --continue -- --testTimeout=30000

      - name: Build
        run: pnpm build

      # The runner's 1024 x 768 screen clamps the 1280 x 820 window, so only some
      # short cards are in view and load; give it a desktop-sized screen.
      - name: Display 1920 x 1080 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: End-to-end tests (built app)
        run: pnpm test:e2e

      - name: Package
        run: pnpm ${{ matrix.package }}

      - name: End-to-end tests (packaged app)
        working-directory: apps/desktop
        env:
          ALCYO_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: pnpm exec playwright test

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: alcyo-shorts-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.target }}
          path: apps/desktop/test-results
          if-no-files-found: ignore

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download both installers
        uses: actions/download-artifact@v4
        with:
          pattern: alcyo-shorts-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          test -n "$(ls *.dmg)" && test -n "$(ls *.exe)"
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Creates the release, or on a re-run replaces its files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "Alcyo Shorts ${GITHUB_REF_NAME#v}" \
              --notes-file .github/release-notes.md
          fi
